name: Build Shinra Tensei.exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name "Shinra Tensei" --hidden-import win32timezone app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Shinra-Tensei
          path: "dist/Shinra Tensei.exe"
