name: Build Shinra Tensei.exe
on:
  push:            # every branch push builds the exe; a tag v* also publishes a GitHub Release
  workflow_dispatch:
permissions:
  contents: write  # needed only to create the release on a tag
jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      # native core (Rust); the windows-latest image already has Rust installed
      - run: rustc --version
      - run: pip install ./native
      - run: python -c "import core.pst_writer as w, core.downloader as d; assert w.NATIVE and d.NATIVE, 'native core not loaded'"
      - name: Tests (native core)
        run: python -m unittest discover -s tests -t . -v
      - name: Tests (pure Python)
        run: python -m unittest discover -s tests -t . -v
        env:
          SHINRA_PURE_PYTHON: "1"
      # папка dist/Shinra Tensei (exe + _internal), настройки сборки — в shinra.spec
      - run: pyinstaller --noconfirm --clean shinra.spec
      - name: Smoke test of the built exe
        run: |
          $log = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $env:SHINRA_SMOKE_LOG = $log
          $p = Start-Process -FilePath "dist/Shinra Tensei/Shinra Tensei.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { Write-Error "smoke test exit code $($p.ExitCode)"; exit 1 }
      - name: Pack zip
        run: |
          $v = python -c "import re;print(re.search(r'^## \[([\d.]+)\]', open('CHANGELOG.md', encoding='utf-8').read(), re.M).group(1))"
          $zip = "Shinra-Tensei-$v-win64.zip"
          Compress-Archive -Path "dist/Shinra Tensei" -DestinationPath $zip
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "{0}: {1:N1} MB" -f $zip, ((Get-Item $zip).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: Shinra-Tensei
          path: "dist/Shinra Tensei"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python .github/release_notes.py "$env:TAG" notes.md
          # the release may already exist (made on github.com together with the tag): then
          # attach the exe and the notes to it instead of failing on "already exists"
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" "$env:ZIP" --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit "$env:TAG" --title "Shinra Tensei $env:TAG" --notes-file notes.md
          } else {
            gh release create "$env:TAG" "$env:ZIP" --title "Shinra Tensei $env:TAG" --notes-file notes.md --verify-tag
          }
